# Nginx configuration for TRAQQ on Hostinger VPS
# Place this file at: /etc/nginx/sites-available/traqq
# Enable: sudo ln -s /etc/nginx/sites-available/traqq /etc/nginx/sites-enabled/
# Test:   sudo nginx -t
# Apply:  sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name traqq.com www.traqq.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name traqq.com www.traqq.com;

    # SSL — certificates issued by Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/traqq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traqq.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Session resumption — reduces handshake overhead
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — faster TLS handshake and revocation check
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"   always;
    add_header X-Content-Type-Options     "nosniff"      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # ---- Backend API (/api/* and /health) ----
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  'upgrade';
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Allow large Stripe webhook payloads
        client_max_body_size 10M;

        # Webhook can take time to process; don't time out too fast
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout  10s;
    }

    location = /health {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        access_log off;
    }

    # ---- Frontend static files ----
    # Nginx serves frontend/ directly — no Node.js process needed for static assets.
    root  /var/www/traqq/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for versioned static assets
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache the SPA shell (index.html)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
