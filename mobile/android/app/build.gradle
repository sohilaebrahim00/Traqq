plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

android {
    namespace "com.traqq.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.traqq.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode localProperties.getProperty("flutter.versionCode")?.toInteger() ?: 1
        versionName localProperties.getProperty("flutter.versionName") ?: "1.0.0"

        // Required for url_launcher
        manifestPlaceholders += [appAuthRedirectScheme: "com.traqq.app"]
    }

    signingConfigs {
        release {
            // Configure via environment variables in CI/CD:
            // storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            // storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            // keyAlias System.getenv("KEY_ALIAS") ?: ""
            // keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            // Use signingConfigs.release for production; signingConfigs.debug for local AAB testing
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                         "proguard-rules.pro"
            debuggable false
        }
    }
}

flutter {
    source "../.."
}
